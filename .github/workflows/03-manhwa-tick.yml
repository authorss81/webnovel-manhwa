name: 03-manhwa-tick
on:
  schedule: [{cron: '*/15 * * * *'}]
  workflow_dispatch:
concurrency:
  group: manhwa-tick
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?status=in_progress&per_page=20" --jq '[.workflow_runs[] | select(.name | startswith("02-"))] | length')
          [ "$N" != "0" ] && { echo "pipeline running, skip"; exit 0; }
          gh api "/repos/${GITHUB_REPOSITORY}/git/trees/HEAD?recursive=1" --jq '.tree[].path' > /tmp/tree.txt
          grep -qx "workspace/.stop" /tmp/tree.txt && { echo "workspace/.stop present, skip tick"; exit 0; }
          gh api -X POST -H "Accept: application/vnd.github+json" "/repos/${GITHUB_REPOSITORY}/dispatches" -f event_type=manhwa_tick -f "client_payload[reason]=safety_net_15m" || true
