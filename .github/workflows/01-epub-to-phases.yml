name: 01-epub-to-phases
on:
  workflow_dispatch:
  push:
    paths: ['novels/*.epub']
permissions:
  contents: write
concurrency:
  group: epub-to-phases
  cancel-in-progress: false
jobs:
  split:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: python3 scripts/epub_to_phases.py
      - run: |
          git config user.name "manhwa-bot"
          git config user.email "manhwa-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "epub: split novels into phases"
          git push origin main || (git pull --rebase origin main && git push origin main)
