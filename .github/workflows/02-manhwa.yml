name: 02-manhwa
on:
  workflow_dispatch:
    inputs:
      phase: {description: 'Force phase (e.g. phase-001)', required: false, default: ''}
  repository_dispatch:
    types: [manhwa_tick]
permissions:
  contents: write
concurrency:
  group: manhwa-pipeline
  cancel-in-progress: false
env:
  OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
  OPENCODE_MODEL: opencode/muse-spark-1.3-contributor-free,opencode/gemini-3-flash,opencode/deepseek-v4-flash-vision-exp,opencode/kimi-k2.5,opencode/muse-spark-1.2-contributor-free
jobs:
  select-phase:
    runs-on: ubuntu-latest
    outputs:
      phase: ${{ steps.p.outputs.phase }}
      exists: ${{ steps.p.outputs.exists }}
    steps:
      - id: p
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/git/trees/HEAD?recursive=1" --jq '.tree[].path' > /tmp/tree.txt
          if [ -n "${{ inputs.phase }}" ]; then echo "phase=${{ inputs.phase }}" >> $GITHUB_OUTPUT; echo "exists=true" >> $GITHUB_OUTPUT; exit 0; fi
          grep -qx "workspace/.stop" /tmp/tree.txt && { echo "phase=" >> $GITHUB_OUTPUT; echo "exists=false" >> $GITHUB_OUTPUT; exit 0; }
          grep -E '^workspace/phase-[0-9]+/' /tmp/tree.txt | cut -d/ -f2 | sort -V -u > /tmp/ph.txt
          while read -r n; do [ -n "$n" ] || continue
            grep -qx "workspace/$n/.done" /tmp/tree.txt && continue
            grep -qx "workspace/$n/.blocked" /tmp/tree.txt && continue
            echo "phase=$n" >> $GITHUB_OUTPUT; echo "exists=true" >> $GITHUB_OUTPUT; exit 0
          done < /tmp/ph.txt
          echo "phase=" >> $GITHUB_OUTPUT; echo "exists=false" >> $GITHUB_OUTPUT
  run-phase:
    needs: select-phase
    if: needs.select-phase.outputs.exists == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: |
          curl -fsSL https://opencode.ai/install | bash -s -- --version 1.15.12
          ~/.opencode/bin/opencode --version || opencode --version
      - run: git pull --ff-only origin main || true
      - id: run
        run: |
          chmod +x scripts/manhwa_runner.sh
          bash scripts/manhwa_runner.sh "${{ needs.select-phase.outputs.phase }}"
        continue-on-error: true
      - run: |
          pip install pillow -q
          python3 scripts/bundle.py "${{ needs.select-phase.outputs.phase }}" || true
      - run: |
          git config user.name "manhwa-bot"
          git config user.email "manhwa-bot@users.noreply.github.com"
          git add workspace || true
          git add "out/${{ needs.select-phase.outputs.phase }}/chapter.html" "out/${{ needs.select-phase.outputs.phase }}/score.json" 2>/dev/null || true
          git diff --cached --quiet || git commit -m "manhwa: ${{ needs.select-phase.outputs.phase }}"
          for i in 1 2 3 4 5; do git push origin main && break; git pull --rebase origin main || true; sleep 3; done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ needs.select-phase.outputs.phase }}
          path: out/${{ needs.select-phase.outputs.phase }}/
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 9
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          P="${{ needs.select-phase.outputs.phase }}"
          gh release view "ch-$P" >/dev/null 2>&1 || gh release create "ch-$P" --title "Chapter $P" --notes "Solo-Leveling-style scroll for $P" 2>/dev/null || true
          gh release upload "ch-$P" "out/$P/"*.jpg "out/$P/chapter.html" --clobber 2>/dev/null || echo "::warning::release upload failed"
  retrigger:
    needs: [select-phase]
    if: always() && needs.select-phase.outputs.exists == 'true'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 10
          gh api -X POST -H "Accept: application/vnd.github+json" "/repos/${GITHUB_REPOSITORY}/dispatches" -f event_type=manhwa_tick -f "client_payload[phase]=${{ needs.select-phase.outputs.phase }}" || echo "::warning::re-dispatch failed"
